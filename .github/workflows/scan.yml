name: Wissam Cascade

on:
  schedule:
    # every 15 minutes. GitHub queues scheduled jobs, so a run can land a few
    # minutes late when the service is busy — that is normal, not a failure.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

concurrency:
  group: wissam-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      # carries state.json from the previous run so the same pair is not
      # announced every quarter of an hour
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: wissam-state-${{ github.run_id }}
          restore-keys: wissam-state-

      - name: Scan
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          MIN_VOLUME: "500000"
          MAX_BARS: "10"
          MAX_BARS_1D: "2"
          CONV_LOOKBACK: "2"
          CONV_MI: "10"
          CONV_CAP: "40"
          COOLDOWN_HOURS: "6"
        run: python wissam_scan.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: wissam-state-${{ github.run_id }}
