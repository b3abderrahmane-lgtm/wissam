name: Wissam Cascade

on:
  schedule:
    # every 15 minutes. GitHub queues scheduled jobs, so a run can land a few
    # minutes late when the service is busy — that is normal, not a failure.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # so settings and the journal can be written back

concurrency:
  group: wissam-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      # carries state.json from the previous run so the same pair is not
      # announced every quarter of an hour
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: wissam-state-${{ github.run_id }}
          restore-keys: wissam-state-

      - name: Scan
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python wissam_scan.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: wissam-state-${{ github.run_id }}

      # settings arrive as Telegram commands and the journal is the record of
      # every signal, so both have to live in the repository, not in the cache
      - name: Commit settings and journal
        if: always()
        run: |
          if [ -z "$(git status --porcelain config.json journal.csv)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "wissam-bot"
          git config user.email "wissam-bot@users.noreply.github.com"
          git add config.json journal.csv
          git commit -m "settings + journal [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing and retrying"
            git pull --rebase --autostash || exit 1
          done
          exit 1
